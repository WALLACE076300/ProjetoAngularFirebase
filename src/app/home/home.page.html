<ion-content [fullscreen]="true">

  <ion-row class="ion-justify-content-center ion-align-items-center" style="padding: 20px;">

    <ion-col size="12" size-md="8" size-lg="6">

      <!-- Título do Formulário -->
      <div class="form-header">
        <h2>Cadastro</h2>
      </div>

      <div class="form-container">
        <!-- Nome Completo -->
        <ion-item>
          <ion-label position="floating">Nome Completo</ion-label>
          <ion-input type="text" [(ngModel)]="usuario.name"></ion-input>
        </ion-item>

        <!-- E-mail -->
        <ion-item>
          <ion-label position="floating">E-mail</ion-label>
          <ion-input type="email" [(ngModel)]="usuario.email"></ion-input>
        </ion-item>

        <!-- Senha -->
        <ion-item>
          <ion-label position="floating">Senha</ion-label>
          <ion-input type="password" [(ngModel)]="usuario.password"></ion-input>
        </ion-item>

        <!-- Confirmação de Senha -->
        <ion-item>
          <ion-label position="floating">Confirmação de Senha</ion-label>
          <ion-input type="password" [(ngModel)]="usuario.password_confirmation"></ion-input>
        </ion-item>

        <!-- Botão Cadastrar -->
        <ion-item>
          <ion-button expand="full" color="primary" (click)="cadastrarUsuario()">
            Cadastrar-se
          </ion-button>
        </ion-item>

        <ion-item lines="none" class="ion-justify-content-center" style="margin-top: 10px;">
            <ion-button expand="block" color="medium" (click)="irParaLogin()">
                Já tem conta? Login
            </ion-button>
        </ion-item>
      </div>

    </ion-col>

  </ion-row>

</ion-content>
