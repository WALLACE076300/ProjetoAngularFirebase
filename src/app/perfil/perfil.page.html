<ion-header>
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" color="primary" (click)="logout()">
    Sair da conta
  </ion-button>
  <!-- FOTO E NOME -->
  <div class="perfil-container">
    <div class="foto-container">
      <img [src]="usuario.foto" alt="Foto de perfil" class="perfil-foto">
      <label class="camera-btn">
        <input type="file" (change)="uploadFoto($event)" hidden>
        <ion-icon name="camera" class="camera-icon"></ion-icon>
      </label>
    </div>
    <h2 class="usuario-nome">{{ usuario.name }}</h2>
    <p class="usuario-email">{{ usuario.email }}</p>
  </div>

  <!-- FORMULÁRIO DE ATUALIZAÇÃO -->
  <ion-list>
    <ion-item>
      <ion-label position="floating">Nome</ion-label>
      <ion-input [(ngModel)]="usuario.name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input [(ngModel)]="usuario.email"></ion-input>
    </ion-item>

    <ion-button expand="block" (click)="atualizarPerfil()">Salvar alterações</ion-button>
  </ion-list>

  <!-- TROCAR SENHA -->
  <ion-list>
    <ion-item>
      <ion-label position="floating">Nova senha</ion-label>
      <ion-input type="password" [(ngModel)]="novaSenha"></ion-input>
    </ion-item>
    <ion-button expand="block" color="primary" (click)="mudarSenha()">Alterar senha</ion-button>
  </ion-list>

  <!-- NOVA POSTAGEM -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Nova Postagem</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-textarea [(ngModel)]="novaPostagem" placeholder="Escreva sua postagem..."></ion-textarea>
      <ion-button expand="block" color="primary" (click)="criarPostagem()">Postar</ion-button>
    </ion-card-content>
  </ion-card>

  <!-- LISTA DE POSTAGENS -->
  <ion-list>
    <ion-item *ngFor="let post of postagens">
      <ion-label>
        <h3>{{ post.user?.name }}</h3>
        <p>{{ post.conteudo }}</p>
        <small>{{ post.created_at | date:'dd/MM/yyyy HH:mm' }}</small>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
